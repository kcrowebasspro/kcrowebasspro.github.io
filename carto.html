<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kevin Crowe — Cartography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141412;
      --surface: #1c1c1a;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #e8e4dc;
      --muted: #8a8680;
      --accent: #c8b99a;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.125rem;
      line-height: 1.75;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(20,20,18,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .nav-name {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--text); }

    /* ── Page header ── */
    .page-header {
      padding: 9rem 2.5rem 3.5rem;
      max-width: 820px;
      margin: 0 auto;
    }

    .page-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    /* ── Card grid ── */
    .grid-section {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 2.5rem 6rem;
      border-top: 1px solid var(--border);
      padding-top: 3rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .card {
      display: block;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      background: var(--surface);
      transition: border-color 0.25s;
    }

    .card:hover { border-color: var(--border-hover); }
    .card:hover .card-img { opacity: 0.95; }
    .card:hover .card-arrow { opacity: 1; transform: translateX(3px); }

    .card-img-wrap {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #111110;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.78;
      transition: opacity 0.3s;
    }

    .card-body {
      padding: 1rem 1.1rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .card-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }

    .card:hover .card-title { color: var(--text); }

    .card-arrow {
      font-size: 0.85rem;
      color: var(--accent);
      opacity: 0.3;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.2s;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .footer-links a {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--text); }

    .footer-copy {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 300;
      color: #4a4844;
      letter-spacing: 0.06em;
    }

    @media (max-width: 600px) {
      nav { padding: 1rem 1.25rem; }
      .nav-links { gap: 1.25rem; }
      .page-header { padding: 7rem 1.25rem 2.5rem; }
      .grid-section { padding: 2.5rem 1.25rem 4rem; }
      .card-grid { grid-template-columns: 1fr; }
      footer { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-name" href="https://kcrowebasspro.github.io">Kevin Crowe</a>
    <ul class="nav-links">
      <li><a href="https://kcrowebasspro.github.io/about.html">About</a></li>
      <li><a href="https://kcrowebasspro.github.io/resume.html">Résumé</a></li>
      <li><a href="https://www.linkedin.com/in/kevintcrowe/" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://github.com/kcrowebasspro" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <p class="page-label">Selected work</p>
    <h1 class="page-title">Cartography</h1>
  </header>

  <section class="grid-section">
    <div class="card-grid">

      <a class="card" href="https://kcrowebasspro.github.io/fema_risk_ratings.html">
        <div class="card-img-wrap">
          <img class="card-img" src="https://kcrowebasspro.github.io/assets/fema_risk_rating_300.png" alt="FEMA Risk Ratings map" loading="lazy" />
        </div>
        <div class="card-body">
          <span class="card-title">FEMA Risk Ratings</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

      <a class="card" href="https://kcrowebasspro.github.io/bivariate_choropleth.html">
        <div class="card-img-wrap">
          <img class="card-img" src="https://kcrowebasspro.github.io/assets/receding_rains_swelling_storms_300.png" alt="Bivariate choropleth map" loading="lazy" />
        </div>
        <div class="card-body">
          <span class="card-title">Bivariate choropleth</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

      <a class="card" href="https://kcrowebasspro.github.io/land_use.html">
        <div class="card-img-wrap">
          <img class="card-img" src="https://kcrowebasspro.github.io/assets/land_use_map_300.png" alt="Land use map" loading="lazy" />
        </div>
        <div class="card-body">
          <span class="card-title">Land use map</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

      <a class="card" href="https://kcrowebasspro.shinyapps.io/pm25-explorer/" target="_blank" rel="noopener">
        <div class="card-img-wrap">
          <img class="card-img" src="assets/PM25_explorer_screenshot.png" alt="PM2.5 Explorer for Allegheny County" loading="lazy" />
        </div>
        <div class="card-body">
          <span class="card-title">PM2.5 Explorer — Allegheny County</span>
          <span class="card-arrow">→</span>
        </div>
      </a>

    </div>
  </section>

  <footer>
    <ul class="footer-links">
      <li><a href="https://twitter.com/kcrowebasspro" target="_blank" rel="noopener">Twitter / X</a></li>
      <li><a href="https://github.com/kcrowebasspro" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
    <span class="footer-copy">&copy; 2025 Kevin Crowe</span>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kevin Crowe — Land Use Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141412;
      --surface: #1c1c1a;
      --border: rgba(255,255,255,0.08);
      --text: #e8e4dc;
      --muted: #8a8680;
      --accent: #c8b99a;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(20,20,18,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .nav-name {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--text); }

    /* ── Page header ── */
    .page-header {
      padding: 9rem 2.5rem 3.5rem;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .page-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 0.95;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .back-link {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .back-link:hover { color: var(--text); }

    /* ── Image ── */
    .image-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 2.5rem 6rem;
      border-top: 1px solid var(--border);
      padding-top: 3rem;
    }

    .image-wrap {
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      background: var(--surface);
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0.92;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .footer-links a {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--text); }

    .footer-copy {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 300;
      color: #4a4844;
      letter-spacing: 0.06em;
    }

    @media (max-width: 600px) {
      nav { padding: 1rem 1.25rem; }
      .nav-links { gap: 1.25rem; }
      .page-header { padding: 7rem 1.25rem 2.5rem; }
      .image-section { padding: 2.5rem 1.25rem 4rem; }
      footer { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-name" href="https://kcrowebasspro.github.io">Kevin Crowe</a>
    <ul class="nav-links">
      <li><a href="https://kcrowebasspro.github.io/about.html">About</a></li>
      <li><a href="https://kcrowebasspro.github.io/resume.html">Résumé</a></li>
      <li><a href="https://www.linkedin.com/in/kevintcrowe/" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://github.com/kcrowebasspro" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <div>
      <p class="page-label">Cartography</p>
      <h1 class="page-title">Land Use<br>Map</h1>
    </div>
    <a class="back-link" href="https://kcrowebasspro.github.io/carto.html">← Back to cartography</a>
  </header>

  <section class="image-section">
    <div class="image-wrap">
      <img src="https://kcrowebasspro.github.io/assets/land_use_map.png" alt="Land use map" />
    </div>
  </section>

  <footer>
    <ul class="footer-links">
      <li><a href="https://twitter.com/kcrowebasspro" target="_blank" rel="noopener">Twitter / X</a></li>
      <li><a href="https://github.com/kcrowebasspro" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
    <span class="footer-copy">&copy; 2025 Kevin Crowe</span>
  </footer>

</body>
</html>
